<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT-opleidingen | Ter AA</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><a class="logo" href="index.html"><span>ter AA</span><small>ICT College</small></a><a class="back" href="index.html">← terug</a></header><section class="card grow"><div class="eyebrow">Ik weet wat ik wil</div><h1>Kies jouw <em>opleiding</em></h1><p>Alle officiële ICT-opleidingen van Ter AA vanaf niveau 2. Kies een opleiding voor een korte uitleg.</p><div class="select-wrap"><select id="studySelect" aria-label="Kies een ICT-opleiding"></select></div><article class="study" id="study"></article></section><footer class="footer">Officiële benamingen van Ter AA · niveau 1 is niet opgenomen</footer></main><script src="studies.js"></script><script>const select=document.querySelector('#studySelect'),box=document.querySelector('#study');STUDIES.forEach((s,i)=>select.add(new Option(`${s.name} — niveau ${s.level}`,i)));function show(){const s=STUDIES[select.value];box.innerHTML=`<div class="level">Niveau ${s.level} · BOL</div><h2>${s.name}</h2><p>${s.summary}</p><a href="${s.url}" target="_blank" rel="noopener">Bekijk op ter-aa.nl ↗</a>`}select.addEventListener('change',show);show();</script></body></html>
