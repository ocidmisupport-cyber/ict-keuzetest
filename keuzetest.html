<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT-keuzetest | Ter AA</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><a class="logo" href="https://www.ter-aa.nl/" target="_blank" rel="noopener"><img src="ter-aa-logo.png" alt="ter AA"></a><a class="back" href="index.html">← terug</a></header><section class="card grow" id="app"></section><footer class="footer">Kies wat het beste past bij het werk dat jij later wilt doen.</footer></main><script src="studies.js"></script><script>
const allowed=STUDIES.filter(s=>s.level>2&&!s.id.endsWith('-en'));let scores={},step=0;
const Q=[
 ['Een collega kan niet meer inloggen. Wat lijkt jou het leukste werk?',['Rustig luisteren en stap voor stap helpen','Uitzoeken welke instellingen of systemen fout staan','Een slimmer inlogprogramma ontwerpen'],[['support'],['system','cyber'],['software']]],
 ['Bij een bedrijf worden vijftig laptops geleverd. Jij wilt vooral…',['de laptops installeren en aan gebruikers uitleggen','accounts, rechten en de verbinding regelen','een app bouwen die de uitgifte bijhoudt'],[['support'],['system','network'],['fullstack']]],
 ['De wifi in een groot gebouw valt uit. Jij…',['helpt medewerkers tijdelijk weer op weg','zoekt in switches, kabels en instellingen naar de fout','maakt een handig storingsdashboard'],[['support'],['network'],['fullstack','software']]],
 ['Een bedrijf krijgt een verdachte e-mail. Jij…',['legt collega’s uit waar ze op moeten letten','onderzoekt de afzender en helpt een aanval voorkomen','bedenkt software die verdachte berichten sneller herkent'],[['support'],['cyber'],['software']]],
 ['Wat zie jij het liefst aan het eind van je werkdag?',['Een collega die weer verder kan','Een netwerk dat veilig en stabiel draait','Een werkend programma dat jij hebt gemaakt'],[['support'],['system','network'],['software']]],
 ['Een organisatie wil bestanden naar de cloud verplaatsen. Jij…',['helpt mensen met de nieuwe manier van werken','richt de cloudomgeving veilig en netjes in','bouwt een webpagina voor de aanvraag'],[['support'],['cloud'],['fullstack']]],
 ['Een klant vraagt om een nieuwe website. Jij bent het liefst degene die…',['uitlegt hoe de klant de website gebruikt','zorgt dat de website veilig online kan','de pagina’s, database en functies bouwt'],[['support'],['system'],['fullstack']]],
 ['Wat spreekt jou bij games het meeste aan?',['Andere spelers helpen als iets niet werkt','zorgen dat online spelen goed en veilig blijft gaan','levels, bewegingen en spelregels programmeren'],[['support'],['network','cyber'],['game']]],
 ['Een app heeft een fout. Wat doe je het liefst?',['De gebruiker helpen met een tijdelijke oplossing','controleren of de fout door de omgeving of het account komt','de code stap voor stap testen en verbeteren'],[['support'],['system'],['software']]],
 ['Een bedrijf opent een nieuwe vestiging. Jij wilt…',['alle werkplekken klaarmaken','het netwerk ontwerpen en beveiligen','een app maken voor de nieuwe medewerkers'],[['support'],['network'],['fullstack']]],
 ['Een hacker probeert binnen te komen. Jij wilt vooral…',['collega’s waarschuwen en begeleiden','de aanval onderzoeken en stoppen','een tool bouwen die vreemde patronen herkent'],[['support'],['cyber'],['software']]],
 ['Wat zou jij het liefst op stage doen?',['Meedraaien op een servicedesk','Meehelpen met netwerk, cloud of cybersecurity','Meebouwen aan websites, apps of programma’s'],[['support'],['system','network','cloud','cyber'],['software','fullstack','game']]]
];
const app=document.querySelector('#app');
function edu(){app.innerHTML=`<div class="eyebrow">ICT-keuzetest</div><h1>Eerst jouw <em>vooropleiding</em></h1><p class="intro">Zo laten we alleen opleidingen zien die bij jouw instroom passen.</p><div class="choices"><button class="choice" data-e="basis"><span class="icon">2</span><span><strong>Vmbo basis</strong><small>Je kunt starten met Medewerker ICT, niveau 2.</small></span><span class="arrow">›</span></button><button class="choice" data-e="other"><span class="icon">3/4</span><span><strong>Andere vooropleiding</strong><small>Vmbo kader, gemengd/theoretisch, havo/vwo of mbo.</small></span><span class="arrow">›</span></button></div>`;app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>b.dataset.e==='basis'?base():start())}
function base(){let s=STUDIES[0];app.innerHTML=`<div class="eyebrow">Jouw route</div><h1>Medewerker <em>ICT</em></h1><p class="result-intro">Met vmbo basis is dit in deze keuzehulp de passende ICT-opleiding op niveau 2.</p><article class="notice"><strong>Wat ga je later doen?</strong>${s.summary}</article><a class="external" href="${s.url}" target="_blank" rel="noopener">Bekijk Medewerker ICT op ter-aa.nl ↗</a><a class="secondary" href="index.html">Terug naar het begin</a>`}
function start(){scores={};allowed.forEach(s=>scores[s.id]=0);step=0;render()}
function render(){let q=Q[step],pct=step/Q.length*100;app.innerHTML=`<div class="eyebrow">Werken in de ICT</div><div class="progressline"><span style="width:${pct}%"></span></div><div class="counter">Vraag ${step+1} van ${Q.length}</div><div class="question">${q[0]}</div><p class="hint">Kies wat jij het liefst zou doen.</p><div class="test-options">${q[1].map((a,i)=>`<button data-i="${i}">${a}</button>`).join('')}</div>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{q[2][b.dataset.i].forEach(id=>scores[id]++);step++;step<Q.length?render():results()})}
function results(){let top=allowed.slice().sort((a,b)=>scores[b.id]-scores[a.id]||a.name.localeCompare(b.name)).slice(0,2);app.innerHTML=`<div class="eyebrow">Jouw ICT-match</div><h1>Jouw <em>top 2</em></h1><p class="result-intro">Dit zijn de twee opleidingen die het beste aansluiten bij de werkzaamheden die jij hebt gekozen.</p><div class="results">${top.map((s,i)=>{let keuze=i===0?'1e keus':'2e keus';return `<article class="result"><span class="rank">${keuze}</span><div class="level">Niveau ${s.level}</div><h2>${s.name}</h2><p>${s.summary}</p><a href="${s.url}" target="_blank" rel="noopener">Bekijk op ter-aa.nl ↗</a></article>`}).join('')}</div><a class="secondary" href="keuzetest.html">Doe de test opnieuw</a>`}
edu();
</script></body></html>
