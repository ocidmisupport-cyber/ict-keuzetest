<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT-keuzetest | Ter AA</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="top"><a class="logo" href="index.html"><span>ter AA</span><small>ICT College</small></a><a class="back" href="index.html">← terug</a></header><section class="card grow" id="app"></section><footer class="footer">Kies wat het beste past bij het werk dat jij later wilt doen.</footer></main><script src="studies.js"></script><script>
const allowed=STUDIES.filter(s=>s.level>2);let scores={},step=0;
const Q=[
 ['Een collega kan niet meer inloggen. Wat lijkt jou het leukste werk?',['Rustig luisteren en stap voor stap helpen','Uitzoeken welke instellingen of systemen fout staan','Een slimmer inlogprogramma ontwerpen','De uitleg en oplossing ook in het Engels geven'],[['support'],['system','cyber'],['software'],['software-en']]],
 ['Bij een bedrijf worden vijftig laptops geleverd. Jij wilt vooral…',['de laptops installeren en aan gebruikers uitleggen','accounts, rechten en de verbinding regelen','een app bouwen die de uitgifte bijhoudt','hiervoor Engelstalige instructies gebruiken'],[['support'],['system','network'],['fullstack'],['fullstack-en']]],
 ['De wifi in een groot gebouw valt uit. Jij…',['helpt medewerkers tijdelijk weer op weg','zoekt in switches, kabels en instellingen naar de fout','maakt een handig storingsdashboard','leest zonder moeite internationale technische handleidingen'],[['support'],['network'],['fullstack','software'],['software-en','fullstack-en']]],
 ['Een bedrijf krijgt een verdachte e-mail. Jij…',['legt collega’s uit waar ze op moeten letten','onderzoekt de afzender en helpt een aanval voorkomen','bedenkt software die verdachte berichten sneller herkent','volgt het internationale nieuws over cyberdreigingen'],[['support'],['cyber'],['software'],['cyber','software-en']]],
 ['Wat zie jij het liefst aan het eind van je werkdag?',['Een collega die weer verder kan','Een netwerk dat veilig en stabiel draait','Een werkend programma dat jij hebt gemaakt','Een digitale oplossing voor gebruikers in meerdere landen'],[['support'],['system','network'],['software'],['software-en','fullstack-en']]],
 ['Een organisatie wil bestanden naar de cloud verplaatsen. Jij…',['helpt mensen met de nieuwe manier van werken','richt de cloudomgeving veilig en netjes in','bouwt een webpagina voor de aanvraag','werkt graag met Engelse namen en documentatie van cloudplatforms'],[['support'],['cloud'],['fullstack'],['cloud','fullstack-en']]],
 ['Een klant vraagt om een nieuwe website. Jij bent het liefst degene die…',['uitlegt hoe de klant de website gebruikt','zorgt dat de website veilig online kan','de pagina’s, database en functies bouwt','met een internationaal team aan de website werkt'],[['support'],['system'],['fullstack'],['fullstack-en']]],
 ['Wat spreekt jou bij games het meeste aan?',['Andere spelers helpen als iets niet werkt','zorgen dat online spelen goed en veilig blijft gaan','levels, bewegingen en spelregels programmeren','games ontwikkelen voor spelers over de hele wereld'],[['support'],['network','cyber'],['game'],['game-en']]],
 ['Een bedrijf wil voorkomen dat gegevens verloren gaan. Jij…',['legt collega’s uit hoe ze veilig werken','regelt back-ups, rechten en systemen','maakt een programma dat controles automatiseert','leest hierover graag ook Engelstalige informatie'],[['support'],['system','cloud'],['software'],['software-en']]],
 ['Een app heeft een fout. Wat doe je het liefst?',['De gebruiker helpen met een tijdelijke oplossing','controleren of de fout door de omgeving of het account komt','de code stap voor stap testen en verbeteren','de fout oplossen met documentatie in het Engels'],[['support'],['system'],['software'],['software-en']]],
 ['Je werkt bij een servicedesk. Welke melding pak je graag op?',['Mijn laptop werkt niet meer','De server of verbinding reageert niet','De website doet iets wat niet hoort','De vraag komt van een internationale collega'],[['support'],['system','network'],['fullstack','software'],['software-en','fullstack-en']]],
 ['Een bedrijf opent een nieuwe vestiging. Jij wilt…',['alle werkplekken klaarmaken','het netwerk ontwerpen en beveiligen','een app maken voor de nieuwe medewerkers','de ICT-oplossing samen met buitenlandse collega’s bouwen'],[['support'],['network'],['fullstack'],['fullstack-en']]],
 ['Waar krijg jij het meeste energie van?',['Direct contact en mensen helpen','Een ingewikkeld technisch probleem uitpluizen','Iets nieuws maken dat eerst nog niet bestond','Werken met Engels en internationale contacten'],[['support'],['system','network','cloud','cyber'],['software','fullstack','game'],['software-en','fullstack-en','game-en']]],
 ['Een hacker probeert binnen te komen. Jij wilt vooral…',['collega’s waarschuwen en begeleiden','de aanval onderzoeken en stoppen','een tool bouwen die vreemde patronen herkent','meedoen aan een internationaal securityteam'],[['support'],['cyber'],['software'],['cyber','software-en']]],
 ['Wat zou jij in een ICT-team het liefst beheren?',['Werkplekken en apparaten','Netwerken, accounts en servers','Code, databases en applicaties','Cloud- of softwarediensten met Engelse documentatie'],[['support'],['system','network'],['software','fullstack'],['cloud','software-en','fullstack-en']]],
 ['Een webshop is traag. Jij…',['helpt de klant die een probleem meldt','controleert verbinding, server en veiligheid','zoekt in de code en database naar de oorzaak','leest technische oplossingen in het Engels'],[['support'],['system','cloud'],['fullstack'],['fullstack-en']]],
 ['Een opdracht is: “Maak iets dat mensen graag gebruiken.” Jij…',['vraagt gebruikers wat er niet goed werkt','zorgt dat het systeem betrouwbaar is','ontwerpt en bouwt de toepassing','werkt graag met internationale voorbeelden en teams'],[['support'],['system'],['software','fullstack'],['software-en','fullstack-en']]],
 ['Een bedrijf wil zijn netwerk uitbreiden. Jij…',['helpt medewerkers met de overgang','kiest apparatuur, maakt verbindingen en test alles','bouwt een programma om netwerkgegevens te tonen','verdiept je in internationale netwerktechnieken'],[['support'],['network'],['software'],['network','software-en']]],
 ['Welke opdracht klinkt het leukst?',['Een nieuwe collega goed op weg helpen','Een systeem veilig houden zonder dat mensen er last van hebben','Een app van idee tot werkend product maken','Een game of app met een Engelstalige doelgroep maken'],[['support'],['cyber','system'],['software','fullstack'],['game-en','software-en','fullstack-en']]],
 ['Je ontdekt dat een wachtwoord is gelekt. Jij…',['legt de medewerker uit wat er nu moet gebeuren','wijzigt rechten en onderzoekt het risico','bedenkt een hulpmiddel voor veilig wachtwoordgebruik','werkt graag met internationale veiligheidsrichtlijnen'],[['support'],['cyber'],['software'],['cyber','software-en']]],
 ['Een organisatie werkt steeds meer online. Jij vindt vooral interessant…',['dat iedereen met de tools overweg kan','dat systemen, data en verbindingen goed beveiligd zijn','dat digitale producten beter en slimmer kunnen','dat je met technologie wereldwijd kunt samenwerken'],[['support'],['cloud','cyber','system'],['fullstack','software'],['fullstack-en','software-en','game-en']]],
 ['Wat past het best bij jou?',['Geduldig uitleggen','Nauwkeurig monitoren en analyseren','Creatief ontwerpen en testen','Engels gebruiken bij vaktaal en samenwerken'],[['support'],['network','cloud','cyber'],['software','fullstack','game'],['software-en','fullstack-en','game-en']]],
 ['Een game loopt vast. Jij wilt…',['de speler uitleggen wat hij kan proberen','kijken of de online verbinding of beveiliging het probleem is','in de game-engine en code zoeken naar de bug','de game internationaal testen en verbeteren'],[['support'],['network'],['game'],['game-en']]],
 ['Wat zou je het liefst op stage doen?',['Meedraaien op een servicedesk','Meehelpen met netwerk, cloud of cybersecurity','Meebouwen aan websites, apps of programma’s','Een internationale stage of een team met Engels als voertaal'],[['support'],['system','network','cloud','cyber'],['software','fullstack','game'],['software-en','fullstack-en','game-en']]],
 ['Een opdrachtgever vertelt wat hij wil. Jij…',['vraagt wat er precies niet werkt voor de gebruiker','denkt na over een veilige technische oplossing','maakt een ontwerp en bouwt daarna de oplossing','presenteert de oplossing met plezier in het Engels'],[['support'],['system','cyber'],['software','fullstack'],['software-en','fullstack-en']]]
];
const app=document.querySelector('#app');function edu(){app.innerHTML=`<div class="eyebrow">ICT-keuzetest</div><h1>Eerst jouw <em>vooropleiding</em></h1><p class="intro">Zo laten we alleen opleidingen zien die bij jouw instroom passen.</p><div class="choices"><button class="choice" data-e="basis"><span class="icon">2</span><span><strong>Vmbo basis</strong><small>Je kunt starten met Medewerker ICT, niveau 2.</small></span><span class="arrow">›</span></button><button class="choice" data-e="other"><span class="icon">3/4</span><span><strong>Andere vooropleiding</strong><small>Vmbo kader, gemengd/theoretisch, havo/vwo of mbo.</small></span><span class="arrow">›</span></button></div>`;app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>b.dataset.e==='basis'?base():start())}function base(){let s=STUDIES[0];app.innerHTML=`<div class="eyebrow">Jouw route</div><h1>Medewerker <em>ICT</em></h1><p class="result-intro">Met vmbo basis is dit in deze keuzehulp de passende ICT-opleiding op niveau 2.</p><article class="notice"><strong>Wat ga je later doen?</strong>${s.summary}</article><a class="external" href="${s.url}" target="_blank" rel="noopener">Bekijk Medewerker ICT op ter-aa.nl ↗</a><a class="secondary" href="index.html">Terug naar het begin</a>`}function start(){scores={};allowed.forEach(s=>scores[s.id]=0);step=0;render()}function render(){let q=Q[step],pct=step/Q.length*100;app.innerHTML=`<div class="eyebrow">Werken in de ICT</div><div class="progressline"><span style="width:${pct}%"></span></div><div class="counter">Vraag ${step+1} van ${Q.length}</div><div class="question">${q[0]}</div><p class="hint">Kies wat jij het liefst zou doen.</p><div class="test-options">${q[1].map((a,i)=>`<button data-i="${i}">${a}</button>`).join('')}</div>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{q[2][b.dataset.i].forEach(id=>scores[id]++);step++;step<Q.length?render():results()})}function results(){let top=allowed.slice().sort((a,b)=>scores[b.id]-scores[a.id]||a.name.localeCompare(b.name)).slice(0,3);app.innerHTML=`<div class="eyebrow">Jouw ICT-match</div><h1>Jouw <em>top 3</em></h1><p class="result-intro">Dit zijn de opleidingen die het beste aansluiten bij de werkzaamheden die jij hebt gekozen.</p><div class="results">${top.map((s,i)=>`<article class="result"><span class="rank">#${i+1}</span><div class="level">Niveau ${s.level}</div><h2>${s.name}</h2><p>${s.summary}</p><a href="${s.url}" target="_blank" rel="noopener">Bekijk op ter-aa.nl ↗</a></article>`).join('')}</div><a class="secondary" href="keuzetest.html">Doe de test opnieuw</a>`}edu();
</script></body></html>
